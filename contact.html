                phEmail: "例：ブランド名、buyer@company.com", phNotes: "ご希望の帽型や販売シーズンをご記入ください",
                footCopy: "© 2026 盛全工業股份有限公司"
            }
        };

        function switchLang(lang, btn) {
            currentLang = lang;
            const dict = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key] !== undefined) el.innerText = dict[key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (dict[key] !== undefined) el.placeholder = dict[key];
            });
            if (autoNote && !userEditedNotes) {
                const notes = document.getElementById('notes-textarea');
                if (notes) notes.value = noteMsg[lang](styleVal);
                autoNote = notes ? notes.value : '';
            }
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.documentElement.lang = lang === 'zh' ? 'zh-TW' : (lang === 'jp' ? 'ja' : 'en');
            document.title = dict.docTitle;
            if (sentFlag) {
                const el = document.getElementById('form-sub');
                if (el) el.innerText = sentMsg[lang];
            }
        }
    </script>
</body>
</html>
